apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-sample-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: portfolio-sample-app
  template:
    metadata:
      labels:
        app: portfolio-sample-app
    spec:
      containers:
        - name: web
          image: nginxdemos/hello
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-sample-app-service
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "ip"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app: portfolio-sample-app
  ports:
    - port: 80
      targetPort: 80